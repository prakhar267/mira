packages:
  - apps/*
  - packages/*

overrides:
  'postcss@<8.5.23': 8.5.23
  'effect@<3.20.0': 3.20.0
  'deepmerge-ts@<8.0.0': 8.0.0
  'esbuild@<0.28.1': 0.28.1
  'xcode>uuid': 11.1.1

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  onnxruntime-node: false
  prisma: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - zod@4.5.4
  - '@aws-sdk/client-s3@3.1123.0'
  - '@aws-sdk/credential-provider-node@3.972.82'

patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch
