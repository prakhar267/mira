name: Mira CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable the locked package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm db:generate

      - name: Verify the workspace
        run: pnpm check

      - name: Verify committed marketing image delivery budgets
        run: pnpm --filter @companion/web assets:check

      - name: Worker-runtime route and SQLite integration tests
        run: pnpm --filter @companion/web test:worker

      - name: Install supported test browsers
        run: pnpm --filter @companion/web exec playwright install --with-deps chromium firefox webkit

      - name: Build Cloudflare target and run isolated browser acceptance
        run: pnpm --filter @companion/web test:browser

      - name: Check patched image parsers and dependency advisories
        run: node apps/web/scripts/dependency-smoke.mjs

      - name: Execute the built artifact in isolated local Workers runtime
        run: node apps/web/scripts/artifact-smoke.mjs
        env:
          QA_DIRECTORY: audit/readiness-${{ github.run_id }}/artifact/

      - name: Seal the source-verified and locally smoke-tested artifact
        run: node apps/web/scripts/release-artifact.mjs create apps/web/dist

      - name: Upload the web build
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mira-worker-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

      - name: Retain synthetic test and audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mira-checks-${{ github.sha }}
          path: |
            apps/web/test-results
            audit/readiness-*/dependency-audit.json
            audit/readiness-*/artifact/production-smoke.json
          if-no-files-found: warn
          retention-days: 7
