name: Mira explicit artifact promotion
on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: Successful Mira CI run containing the tested Worker artifact
        required: true
        type: string
      commit_sha:
        description: Exact 40-character commit tested by that run
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mira-production
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Validate promotion input
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_RUN: ${{ inputs.verified_run_id }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]] || exit 1
      - name: Establish trusted CI provenance before executing source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_RUN: ${{ inputs.verified_run_id }}
        run: |
          result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN")"
          test "$(jq -r '.conclusion' <<< "$result")" = success
          test "$(jq -r '.head_sha' <<< "$result")" = "$RELEASE_SHA"
          test "$(jq -r '.path' <<< "$result")" = '.github/workflows/ci.yml'
          test "$(jq -r '.head_repository.full_name' <<< "$result")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head_branch' <<< "$result")" = main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Fetch only a successful CI artifact from this repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_RUN: ${{ inputs.verified_run_id }}
        run: |
          gh run download "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --name "mira-worker-$RELEASE_SHA" --dir apps/web/dist
          node apps/web/scripts/release-artifact.mjs verify apps/web/dist "$RELEASE_SHA"
      - name: Validate release credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure scoped Cloudflare credentials in the approved production environment.'; exit 1; }
      - name: Deploy without rebuilding the verified artifact
        working-directory: apps/web
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Post-deploy smoke must succeed
        run: pnpm --filter @companion/web smoke:production
        env:
          MIRA_EXPECTED_SHA: ${{ inputs.commit_sha }}
          QA_DIRECTORY: audit/release-${{ github.run_id }}/
      - name: Retain deployment smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mira-promotion-${{ github.run_id }}
          path: audit/release-${{ github.run_id }}/
          if-no-files-found: warn
      - name: Stop promotion and record a failed release
        if: failure()
        run: |
          echo 'Release verification or smoke failed. Do not declare success or retry blindly. Use docs/DEPLOYMENT.md: contain and inspect, then choose a SQLite-compatible forward fix or approved rollback.'
          exit 1
