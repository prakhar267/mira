name: Deploy integrated Worker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saathkind-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CF_WORKER_NAME: saathkind
      EXPECTED_APP_ORIGIN: https://saathkind.prakhargupta267.workers.dev
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate deploy credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the protected production environment."
            exit 1
          fi
          if [[ -z "${APP_ORIGIN:-}" ]]; then
            echo "::error::Configure the https APP_ORIGIN variable in the protected production environment."
            exit 1
          fi
          case "${APP_ORIGIN}" in
            https://*) ;;
            *) echo "::error::APP_ORIGIN must be an https:// origin."; exit 1 ;;
          esac
          if [[ "${APP_ORIGIN%/}" != "${EXPECTED_APP_ORIGIN}" ]]; then
            echo "::error::APP_ORIGIN must be the reviewed Saathkind Worker origin: ${EXPECTED_APP_ORIGIN}"
            exit 1
          fi

      - name: Rebuild and verify from the locked revision
        working-directory: app
        shell: bash
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npm run test:sites
          node --test test-api/*.test.mjs

      - name: Install pinned Wrangler CLI without production credentials
        working-directory: app
        shell: bash
        run: npx --yes wrangler@4.123.0 --version

      - name: Dry-run the exact integrated bundle
        working-directory: app
        shell: bash
        run: >-
          npx --yes wrangler@4.123.0 deploy
          --config wrangler.jsonc
          --dry-run
          --outdir "${RUNNER_TEMP}/saathkind-wrangler"

      - name: Deploy integrated Worker, assets, and triggers
        working-directory: app
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 deploy --config wrangler.jsonc

      - name: Smoke-test configured origin
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors "${APP_ORIGIN%/}/" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -H 'Accept: text/html' "${APP_ORIGIN%/}/__deployment_smoke__" >/dev/null
          health_file="${RUNNER_TEMP}/saathkind-health.json"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -H 'Accept: application/json' "${APP_ORIGIN%/}/api/v1/health" > "${health_file}"
          node -e 'const fs=require("node:fs"); const body=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!body.ok || body.data?.status !== "ok" || body.data?.persistence !== "durable-object-demo" || body.data?.version !== "1.0.0") { console.error(body); process.exit(1); }' "${health_file}"

      - name: Prove the complete synthetic account lifecycle
        working-directory: app
        shell: bash
        run: node scripts/post-deploy-canary.mjs "${APP_ORIGIN%/}"

      - name: Record active deployment
        working-directory: app
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 deployments status --name "${CF_WORKER_NAME}"
